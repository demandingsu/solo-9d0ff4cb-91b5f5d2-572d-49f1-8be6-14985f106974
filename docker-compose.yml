services:
  api:
    build: .
    image: vcf-normalizer:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/variants.db
    volumes:
      - variant-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  variant-data:
